# Toolchain pinned for local development and CI.
#
# Keep this in sync with the `toolchain` input of dtolnay/rust-toolchain in
# .github/workflows/{ci,release,paseo-compat}.yml and the `FROM rust:` builder
# tag in the Dockerfile. The fmt job asserts that these four pins agree; if you
# bump one, bump all of them (and the Docker image digest) in the same PR.
#
# `rust-version` in Cargo.toml is the minimum supported Rust version, which can
# legitimately stay below the pinned toolchain; it is a separate promise.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
