name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure the tag commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Documentation links and Chinese/English pairing
        run: python3 scripts/check-docs.py
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  image:
    name: Publish multi-arch image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test the image before publishing
        run: |
          set -euo pipefail
          docker build --tag paseo-relay:release-check \
            --build-arg PASEO_RELAY_BUILD_REVISION="${GITHUB_SHA}" .
          container=paseo-relay-release-check
          cleanup() { docker rm --force "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "${container}" --read-only --cap-drop ALL \
            --security-opt no-new-privileges --publish 127.0.0.1:14000:4000 \
            paseo-relay:release-check
          for _attempt in $(seq 1 100); do
            if curl --fail --silent --show-error http://127.0.0.1:14000/health >/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          echo 'release image did not become healthy' >&2
          docker logs "${container}" >&2 || true
          exit 1
      - name: Compute image reference
        id: image
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${repo}:${GITHUB_REF_NAME},ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            PASEO_RELAY_BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image reference
        run: |
          echo "## Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "Provenance and SBOM were attached by the build." >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: |
            Published container image:
            `${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}`

            Verify with `docker pull ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}`.
            See `README.md` for the runtime contract and `docs/compatibility.md`
            for Paseo compatibility notes.
