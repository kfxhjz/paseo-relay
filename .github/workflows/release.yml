name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default: reading the repository is enough for checkout
# and verification. The image and publish jobs opt in to `packages: write`
# below because only they push to GHCR.
permissions:
  contents: read

# Serialise releases so two tags pushed close together cannot race `latest`.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure the tag commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Documentation links and Chinese/English pairing
        run: python3 scripts/check-docs.py
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  image:
    name: Build ${{ matrix.platform }} image
    needs: verify
    # Push per-platform digests to GHCR; no repository write access is needed.
    permissions:
      contents: read
      packages: write
    # Build each architecture on a matching native runner. This avoids the
    # slow QEMU emulation that dominated the previous single-job build.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute image reference
        id: image
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # Digest-only push here; the publish job assembles the multi-arch
          # index after both platforms finish.
          outputs: "type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true"
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          build-args: |
            PASEO_RELAY_BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          test -n "${digest}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image and release
    needs: image
    # Assemble the GHCR manifest (`packages: write`) and create the GitHub
    # release (`contents: write`).
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        id: merge
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME}"
          sources=()
          while IFS= read -r -d '' file; do
            sources+=("${name}@sha256:$(basename "${file}")")
          done < <(find /tmp/digests -type f -print0)
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "expected 2 platform digests, found ${#sources[@]}" >&2
            exit 1
          fi
          # Move the floating `latest` tag only for stable releases. Prerelease
          # tags such as `v1.0.0-rc1` or `v1.0.0-beta.1` contain a '-' and must
          # not become `latest`, otherwise a pre-release would silently replace
          # the current stable image. Every tag (including prereleases) still
          # gets its own immutable version tag.
          tag_args=(--tag "${name}:${tag}")
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            tag_args+=(--tag "${name}:latest")
          fi
          # GitHub reads the package description, license, and linked repository
          # from annotations on the OCI image *index* for multi-arch images.
          # Dockerfile labels alone are not enough here: the per-platform
          # manifests carry them, but the package page reads the index.
          annotation_args=(
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --annotation "index:org.opencontainers.image.description=Self-hostable, wire-compatible relay for Paseo, written in Rust"
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0"
          )
          docker buildx imagetools create \
            "${annotation_args[@]}" \
            "${tag_args[@]}" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${name}:${tag}" | awk '/^Digest:/ {print $NF; exit}')"
          test -n "${digest}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the published image
        run: |
          set -euo pipefail
          ref="${{ steps.merge.outputs.name }}:${{ github.ref_name }}"
          container=paseo-relay-release-check
          trap 'docker rm --force "${container}" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "${container}" --read-only --cap-drop ALL \
            --security-opt no-new-privileges --publish 127.0.0.1:14000:4000 \
            "${ref}"
          for _attempt in $(seq 1 100); do
            if curl --fail --silent --show-error http://127.0.0.1:14000/health >/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          echo 'published release image did not become healthy' >&2
          docker logs "${container}" >&2 || true
          exit 1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.4.1"
      - name: Sign the immutable image digest
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.merge.outputs.digest }}" > image-digest.txt
          cosign sign-blob --yes \
            --output-signature image-digest.txt.sig \
            --output-certificate image-digest.txt.pem \
            image-digest.txt
      - name: Record immutable image reference
        run: |
          {
            echo "## Image"
            echo ""
            echo "Published \`${{ steps.merge.outputs.name }}@${{ steps.merge.outputs.digest }}\`"
            echo "Provenance and SBOM attestations were attached per platform by buildx."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            image-digest.txt
            image-digest.txt.sig
            image-digest.txt.pem
          # Do not let a prerelease tag become the repository's "Latest
          # release"; only stable tags (no '-') are candidates.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Published container image:
            `${{ steps.merge.outputs.name }}@${{ steps.merge.outputs.digest }}`

            Verify with `docker pull ${{ steps.merge.outputs.name }}@${{ steps.merge.outputs.digest }}`.
            See `README.md` for the runtime contract and `docs/compatibility.md`
            for Paseo compatibility notes.
