# Example: HAProxy in front of Paseo Relay.
#
# `balance url_param(serverId)` plus `hash-type consistent` keeps every socket
# for a given Paseo serverId on one relay node. The readiness check removes a
# draining node from rotation; SIGTERM then closes existing sessions after the
# relay's grace window.
#
# `serverId` is a bearer routing secret in the query string. The custom
# `log-format` below logs `path` (no query) rather than the full request line;
# `option httplog` would leak it.

global
    maxconn 50000

defaults
    mode http
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h
    log-format "%ci:%cp [%tr] %ft %b/%s %ST %B %[path]"

frontend paseo_tls
    bind :443 ssl crt /etc/haproxy/tls/relay.example.com.pem

    # Never expose the relay operations endpoints on the public listener.
    acl is_operations path -i /metrics /ready /version
    http-request deny deny_status 404 if is_operations

    # Per-source connection/rate limits for an edge that terminates TLS
    # directly. `src` is the peer address; behind another proxy/CDN it is the
    # proxy, so move these limits to that outer edge instead. Raise the
    # thresholds for NATed users and for multi-session clients.
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s),http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_conn_cur(0) gt 64 }
    http-request deny deny_status 429 if { sc_conn_rate(0) gt 50 }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    default_backend paseo_relay

backend paseo_relay
    balance url_param(serverId)
    hash-type consistent
    option httpchk GET /ready
    http-check expect status 200

    server relay-1 10.0.0.11:4000 check inter 2s fall 3 rise 2
    server relay-2 10.0.0.12:4000 check inter 2s fall 3 rise 2
