# Single-node quickstart with a read-only, non-root container.
#
# This pulls the published image by default. Override it with PASEO_RELAY_IMAGE,
# ideally by digest for production. To build from a local checkout instead, add
# the build override:
#   docker compose -f examples/docker-compose.yml \
#     -f examples/docker-compose.build.yml up -d --build
#
# For anything public, terminate TLS at a reverse proxy / load balancer and
# hash on the `serverId` query parameter (see examples/nginx.conf and
# examples/haproxy.cfg). Expose the relay only on a private interface.
services:
  paseo-relay:
    image: "${PASEO_RELAY_IMAGE:-ghcr.io/kfxhjz/paseo-relay:v0.1.1}"
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # WebSocket sessions are long-lived; do not inherit a low host fd limit.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Defaults sized for a 512 MB container. Raise PASEO_RELAY_MEM_LIMIT and the
    # connection caps together, or the process will be OOM-killed.
    mem_limit: "${PASEO_RELAY_MEM_LIMIT:-512m}"
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PASEO_RELAY_HOST: "0.0.0.0"
      PASEO_RELAY_PORT: "4000"
      PASEO_RELAY_LOG: "info"
      PASEO_RELAY_LOG_FORMAT: "json"
      # Sized for a 512 MB container; raise together with PASEO_RELAY_MEM_LIMIT.
      # An idle accepted socket costs ~23 KiB, so keep MAX_TCP_CONNECTIONS well
      # below RAM/30 KiB. The built-in defaults (20k/25k) need ~700-800 MiB idle.
      PASEO_RELAY_MAX_CONNECTIONS: "4000"
      PASEO_RELAY_MAX_SESSIONS: "4000"
      PASEO_RELAY_MAX_TCP_CONNECTIONS: "5000"
      # PUBLIC DEPLOYMENTS: terminate TLS at the edge and leave these unset.
      # For a private network with native TLS, mount PEM files and set both:
      # PASEO_RELAY_TLS_CERT: "/tls/cert.pem"
      # PASEO_RELAY_TLS_KEY: "/tls/key.pem"
      # For direct exposure set a per-IP cap; behind a proxy leave it at 0:
      PASEO_RELAY_PER_IP_MAX_CONNECTIONS: "0"
    # The binary is its own healthcheck client (scratch image has no shell).
    healthcheck:
      test: ["CMD", "/paseo-relay", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s
    stop_grace_period: 30s
