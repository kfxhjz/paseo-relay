# Example alerting rules. Thresholds are starting points; tune to your traffic.
groups:
  - name: paseo-relay
    rules:
      - alert: PaseoRelayNotReady
        expr: paseo_relay_ready == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Paseo relay {{ $labels.instance }} is not admitting new work"
      - alert: PaseoRelayConnectionRejections
        expr: increase(paseo_relay_connection_rejections_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Relay {{ $labels.instance }} is rejecting WebSocket upgrades"
      # Per-session and per-connection caps are counted separately from the
      # global MAX_SESSIONS ceiling (session_rejections_total). A sustained
      # stream from either one is single-tenant abuse or a mis-sized limit, not
      # cluster capacity exhaustion.
      - alert: PaseoRelaySessionConnectionRejections
        expr: increase(paseo_relay_session_connection_rejections_total[5m]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Relay {{ $labels.instance }} is rejecting clients over a session connection cap"
      - alert: PaseoRelayClientLimitRejections
        expr: increase(paseo_relay_client_limit_rejections_total[5m]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Relay {{ $labels.instance }} is rejecting clients over a per-connection client cap"
      # The operations listener has its own small connection budget. Rejections
      # here mean /ready, /metrics and container probes may be unreachable even
      # though the public listener is fine.
      - alert: PaseoRelayOpsRejections
        expr: increase(paseo_relay_ops_rejections_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Relay {{ $labels.instance }} is rejecting operations-listener connections"
      - alert: PaseoRelaySlowConsumers
        expr: increase(paseo_relay_slow_consumer_disconnects_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Relay {{ $labels.instance }} is shedding slow destinations"
      # Ratio of the configured budget, so the rule works for the built-in
      # 512 MiB default and for smaller budgets such as the 129 MiB Compose
      # example. The gauge guard keeps the division well-defined.
      - alert: PaseoRelayIngressSaturated
        expr: |
          paseo_relay_ingress_budget_bytes > 0
          and
          paseo_relay_ingress_reserved_bytes / paseo_relay_ingress_budget_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Relay {{ $labels.instance }} ingress budget is >80% reserved"
      # The two rules below use counters added after v0.1.2; on older relays
      # the series do not exist and the rules simply never fire.
      #
      # Reclaims mean the budget was full and the relay closed stalled or
      # oversized in-progress messages to keep other sessions moving. A few
      # are normal under load; a steady stream is someone parking unfinished
      # messages, or a budget that is too small for the traffic.
      - alert: PaseoRelayIngressReclaims
        expr: increase(paseo_relay_ingress_reclaims_total[5m]) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Relay {{ $labels.instance }} keeps reclaiming in-progress messages to free ingress budget"
      # Rejections mean a source waited the whole reservation timeout and was
      # closed 1013: reclaiming did not free enough. Users are being dropped.
      - alert: PaseoRelayIngressRejections
        expr: increase(paseo_relay_ingress_rejections_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Relay {{ $labels.instance }} is closing sources that cannot reserve ingress budget"
