# Example: TLS termination + WebSocket routing + serverId consistent hashing.
#
# All sockets for one Paseo `serverId` MUST land on the same relay node. Nginx
# OSS can hash on a query-string variable; `$arg_serverId` is the value of the
# `serverId` query parameter. Use the same upstream for /ws only, and keep
# health/readiness behind the same upstream for passive health checks.
#
# `serverId` is a bearer routing secret and lives in the query string, so this
# example never logs `$request` (which includes the query).
#
# Operations exposure: `/metrics` and `/version` are denied publicly, and
# `/ready` is proxied only to private client ranges (LB/monitoring). The relay
# has no authentication on these endpoints.

worker_processes auto;

events {
    worker_connections 65535;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Log method + path + protocol only, never the query string.
    log_format paseo_no_query '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" $status '
                              '$body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/paseo-access.log paseo_no_query;

    # Per-client-IP limits for an edge that terminates TLS directly. Here
    # $binary_remote_addr is the end user, so this bounds connect floods and
    # connection hoarding. Tune the thresholds for NATed users and for how many
    # sessions one user runs. If you put another proxy/CDN in front of this
    # nginx, it sees only the proxy IP: move the limits to that outer edge (or
    # configure real_ip_module) instead of shrinking these caps.
    limit_conn_zone $binary_remote_addr zone=paseo_ws_conn:10m;
    limit_req_zone  $binary_remote_addr zone=paseo_ws_req:10m rate=10r/s;

    upstream paseo_relay {
        # Consistent hashing on the Paseo routing key. Do not use round-robin.
        hash $arg_serverId consistent;
        server 10.0.0.11:4000 max_fails=3 fail_timeout=5s;
        server 10.0.0.12:4000 max_fails=3 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 443 ssl;
        server_name relay.example.com;

        ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

        # WebSocket + Paseo endpoints.
        location /ws {
            proxy_pass http://paseo_relay;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Per-IP limits: max concurrent WebSockets and connect rate. Only
            # enable these on a direct-exposure edge; see the zone comment.
            limit_conn paseo_ws_conn 64;
            limit_req  zone=paseo_ws_req burst=30 nodelay;

            # Long-lived sessions: disable short proxy timeouts.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /health {
            proxy_pass http://paseo_relay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /ready {
            # Readiness is for the LB/monitoring only, never the public
            # internet. Allow private client ranges and deny everyone else.
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://paseo_relay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Never expose operations surfaces publicly; scrape the relay directly
        # from a private address.
        location = /metrics {
            deny all;
            return 403;
        }

        location = /version {
            deny all;
            return 403;
        }

        location / {
            return 404;
        }
    }
}
