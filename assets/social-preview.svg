<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Paseo Relay">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c16"/>
      <stop offset="1" stop-color="#122033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.18" fill="none" stroke="#22d3ee" stroke-width="2">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M0 600h1280"/>
    <path d="M150 0v640M300 0v640M450 0v640M600 0v640M750 0v640M900 0v640M1050 0v640M1200 0v640"/>
  </g>
  <g transform="translate(40,5)">
    <g transform="translate(84,90)">
      <rect width="96" height="96" rx="24" fill="#0b1220" stroke="url(#accent)" stroke-width="4"/>
      <g fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
        <path d="M22 34h20l12 14 12-14h8"/>
        <path d="M22 62h20l12-14 12 14h8"/>
      </g>
      <circle cx="22" cy="34" r="5" fill="#22d3ee"/>
      <circle cx="22" cy="62" r="5" fill="#34d399"/>
      <circle cx="74" cy="34" r="5" fill="#22d3ee"/>
      <circle cx="74" cy="62" r="5" fill="#34d399"/>
    </g>
    <text x="84" y="300" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">Paseo Relay</text>
    <text x="84" y="358" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="32">Single-node, wire-compatible relay for Paseo — written in Rust</text>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" fill="#e2e8f0">
      <text x="88" y="444">One static binary · no Erlang / EPMD / cookie</text>
      <text x="88" y="486">E2EE payloads stay opaque · verified against Paseo v0.15.3</text>
      <text x="88" y="528">Native TLS · bounded memory · SIGTERM drain</text>
    </g>
    <text x="84" y="584" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">github.com/kfxhjz/paseo-relay</text>
  </g>
